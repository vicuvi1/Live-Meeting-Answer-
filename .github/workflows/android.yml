name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Version and signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Offset keeps CI builds above locally built ones (versionCode 1).
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 10))" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      # The runner image ships the Android SDK; Gradle fetches anything missing.
      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "asistent-sedinte-1.0.$BUILD_NUMBER.apk"

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Asistent Ședințe 1.0.${{ env.BUILD_NUMBER }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Instalează `asistent-sedinte-1.0.${{ env.BUILD_NUMBER }}.apk` pe telefon (sau apasă „Descarcă actualizarea” în aplicație).
            Built from ${{ github.sha }}.
          files: android/asistent-sedinte-1.0.${{ env.BUILD_NUMBER }}.apk
